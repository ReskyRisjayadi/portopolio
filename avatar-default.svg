<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdfc4"/>
      <stop offset="100%" stop-color="#f0be9b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Base Background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" filter="url(#softGlow)"/>

  <!-- Decorative Orbit Rings -->
  <circle cx="200" cy="200" r="176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>

  <!-- Torso & Professional Shirt -->
  <g id="body">
    <!-- Inner Collar -->
    <path d="M165 270 L200 325 L235 270 L200 240 Z" fill="#ffffff"/>
    <path d="M198 275 L202 275 L201 370 L199 370 Z" fill="#2563eb"/>
    <!-- Navy Executive Shirt -->
    <path d="M95 400 C100 325 142 275 168 265 L200 320 L232 265 C258 275 300 325 305 400 Z" fill="url(#shirtGrad)"/>
    <!-- Collar Flaps -->
    <path d="M168 265 L198 325 L180 320 L152 278 Z" fill="#2563eb"/>
    <path d="M232 265 L202 325 L220 320 L248 278 Z" fill="#2563eb"/>
  </g>

  <!-- Neck -->
  <rect x="182" y="215" width="36" height="60" rx="8" fill="url(#skinGrad)"/>
  <path d="M182 230 C192 245 208 245 218 230 L218 250 C208 258 192 258 182 250 Z" fill="#df9f7a" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="62" ry="76" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <ellipse cx="138" cy="175" rx="10" ry="16" fill="url(#skinGrad)"/>
  <ellipse cx="262" cy="175" rx="10" ry="16" fill="url(#skinGrad)"/>

  <!-- Modern Hair Cut -->
  <path d="M138 165 C138 105 162 90 200 90 C238 90 264 110 264 165 C264 170 258 150 250 140 C240 130 218 116 185 120 C160 124 146 142 138 165 Z" fill="url(#hairGrad)"/>
  <path d="M142 135 C162 108 212 102 255 122 C245 108 222 96 190 96 C162 96 148 116 142 135 Z" fill="#334155" opacity="0.6"/>

  <!-- Eyebrows -->
  <path d="M162 152 Q176 146 186 150" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M214 150 Q224 146 238 152" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="174" cy="168" rx="5.5" ry="6.5" fill="#0f172a"/>
  <circle cx="176" cy="166" r="1.8" fill="#ffffff"/>
  <ellipse cx="226" cy="168" rx="5.5" ry="6.5" fill="#0f172a"/>
  <circle cx="228" cy="166" r="1.8" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M198 175 L196 194 L204 194" stroke="#d97746" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M182 210 Q200 224 218 210" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Subtle Highlights -->
  <circle cx="95" cy="130" r="3" fill="#38bdf8"/>
  <circle cx="305" cy="135" r="3.5" fill="#60a5fa"/>
  <circle cx="85" cy="240" r="2.5" fill="#93c5fd"/>
  <circle cx="315" cy="255" r="3" fill="#38bdf8"/>
</svg>
